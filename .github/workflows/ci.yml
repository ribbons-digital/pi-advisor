name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-pi-1-0-0:
    name: Verify Pi 1.0.0 on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19.0", "22.22.3"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify installed Pi 1.0.0 packages
        run: |
          for package_name in pi-agent-core pi-ai pi-coding-agent pi-tui; do
            actual_version="$(node -p "require('./node_modules/@earendil-works/${package_name}/package.json').version")"
            test "$actual_version" = "1.0.0"
          done
      - run: pnpm verify
      - run: PI_EXPECTED_VERSION=1.0.0 pnpm test:e2e
      - run: pnpm pack:validate
