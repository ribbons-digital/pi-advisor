name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing approved release tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: npm-release
      url: https://www.npmjs.com/package/@ribbons-digital/pi-advisor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: PI_EXPECTED_VERSION=1.0.0 pnpm test:e2e
      - name: Verify approved tag and publishable manifest
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node <<'NODE'
          const manifest = require('./package.json');
          const expectedTag = `v${manifest.version}`;
          if (process.env.RELEASE_TAG !== expectedTag) {
            throw new Error(`Requested tag ${process.env.RELEASE_TAG} does not match ${expectedTag}`);
          }
          if (manifest.private) {
            throw new Error('package.json is not publishable');
          }
          if (manifest.publishConfig?.access !== 'public' || manifest.publishConfig?.provenance !== true) {
            throw new Error('package publishConfig must require public access and provenance');
          }
          NODE
          test "$(git describe --tags --exact-match)" = "$RELEASE_TAG"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
      - name: Prepare and validate the exact publish tarball
        run: pnpm pack:prepare
      - name: Publish the validated tarball with npm trusted publishing provenance
        run: pnpm exec npm publish ./pi-advisor-package.tgz --access public --provenance
